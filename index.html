    <style>
        :root {

        body {
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            min-height: 100vh;
        }

        .bg-wrapper {
            position: fixed;
            inset: 0;
            z-index: -2;
            background: url('background.png') no-repeat center center / cover;
            transform: scale(1.05);
            filter: blur(8px) brightness(0.45);
        }

        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(10, 11, 14, 0.84);
            backdrop-filter: blur(4px);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            backdrop-filter: blur(8px);
        }

        .profile-glass-box {
            background: rgba(0, 242, 255, 0.01);

            border-radius: 14px;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.05);
        }

        .pill-btn {
            padding: 8px 16px;
            border-radius: 12px;
            transition: all 0.25s ease;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #a1a1aa;
            font-weight: 600;
            font-size: 0.85rem;

        @media (min-width: 768px) {

        }

        .pill-btn.active {
            background: rgba(0, 242, 255, 0.06);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.15);
        }

        .sub-pill {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            transition: all 0.2s;
            border: 1px solid transparent;
            color: #a1a1aa;
            font-weight: 700;
            font-size: 0.95rem;
            white-space: nowrap;
        }
        .sub-pill:hover { color: #ffffff; }
        .sub-pill.active {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(0, 242, 255, 0.3);
            color: var(--accent-cyan);
        }

        .tier-column {
            background: rgba(5, 6, 8, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            min-height: 250px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        @media (min-width: 768px) { .tier-column { height: 75vh; } }
        
        .tier-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            text-align: center;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 1.1rem;
        }

        .tier-1 { color: #ffe633; background: rgba(255, 215, 0, 0.12); border-bottom-color: rgba(255, 215, 0, 0.25); }
        .tier-2 { color: #f0f0f0; background: rgba(192, 192, 192, 0.12); border-bottom-color: rgba(192, 192, 192, 0.25); }
        .tier-3 { color: #ff9944; background: rgba(205, 127, 50, 0.12); border-bottom-color: rgba(205, 127, 50, 0.25); }
        .tier-standard { color: #a1a1aa; background: rgba(255, 255, 255, 0.01); border-bottom-color: rgba(255, 255, 255, 0.04); }

        .player-square {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 10px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .player-square:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 242, 255, 0.3);
            transform: translateY(-2px);
        }

        .rating-num {
            color: var(--accent-cyan);
            font-weight: 800;
            font-size: 1.3rem;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.2);
        }

        .podium-1st { background: linear-gradient(to right, rgba(255, 223, 0, 0.1), rgba(255, 223, 0, 0.03), rgba(255, 255, 255, 0.02)); border-left: 2px solid rgba(255, 223, 0, 0.4); }
        .podium-2nd { background: linear-gradient(to right, rgba(224, 224, 224, 0.1), rgba(224, 224, 224, 0.03), rgba(255, 255, 255, 0.02)); border-left: 2px solid rgba(224, 224, 224, 0.4); }
        .podium-3rd { background: linear-gradient(to right, rgba(184, 115, 51, 0.1), rgba(184, 115, 51, 0.03), rgba(255, 255, 255, 0.02)); border-left: 2px solid rgba(184, 115, 51, 0.4); }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(4, 5, 7, 0.85);
            z-index: 100;
            backdrop-filter: blur(20px);
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.active { display: flex; }

        .search-input {
            width: 100%;

            border: 1px solid rgba(255,255,255,0.08);

        ::-webkit-scrollbar { width: 6px; height: 6px; }

        ::-webkit-scrollbar-thumb { background: rgba(0, 242, 255, 0.3); border-radius: 10px; }

        * { scrollbar-width: thin; scrollbar-color: rgba(0, 242, 255, 0.4) rgba(0, 0, 0, 0.2); }
    </style>
</head>

        const SUB_MODES = ['minecart', 'dsmp', 'spearmace', 'speed', 'ogvanilla', 'creeper', 'bed', 'debuff', 'trident', 'diamondsurvival', 'manhunt', 'bow', 'elytra'];

            'Og Vanilla': 'https://cdn.discordapp.com/attachments/1535027840972619856/1535038502033424544/og_vanilla.png?ex=6a764f82&is=6a74fe02&hm=f11ddd93c9982bb1d1c8ca4bd5bd8e437588765162139e4422ea5c96567155f7&',

            'Debuff': 'https://cdn.discordapp.com/attachments/1535027840972619856/1535038499282096189/debuff.png?ex=6a764f81&is=6a74fe01&hm=605206e29a048164e19969f2eaa2291f0f8a118e55daf74fbb6b6e09e65af773&',

            'Bow': 'https://cdn.discordapp.com/attachments/1535027840972619856/1535038520991813853/bow.png?ex=6a764f87&is=6a74fe07&hm=36aef849ab1cfa2215e8071a4d6be8522a16567ba62be07c771979d98ec16196&',

        const ICONS = {
            trophy: `<svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-cyan-400"><path d="M18 2H6c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 13.9V17H8v2h8v-2h-3v-3.1a5.01 5.01 0 0 0 2.61-3.96C18.08 9.63 20 7.55 20 5V4c0-1.1-.9-2-2-2zm-10 5.09A3.001 3.001 0 0 1 6 4h2v3.09zM18 4v1c0 .98-.71 1.79-1.64 1.97A2.996 2.996 0 0 1 16 4h2z"/></svg>`,
            globe: `<svg viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 text-cyan-400"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>`
        };

        // Firebase Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyDsi2sk-hGyhkI1rqVpmSbozKVPDaoVyf8",
            authDomain: "banana-tiers.firebaseapp.com",
            databaseURL: "https://banana-tiers-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "banana-tiers",
            storageBucket: "banana-tiers.firebasestorage.app",
            messagingSenderId: "180092644757",
            appId: "1:180092644757:web:2092687c03e602cf16da9c",
            measurementId: "G-HYECP0CP35"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        function init() {
            setupEventListeners();
            
            const userRef = ref(db, 'tier_list');
            onValue(userRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    renderEmptyState('No verified tier data found.');
                    return;
                }
                
                state.players = parsePlayerData(data);
                renderSubNav();
                renderContent();
            });
        }

        function parsePlayerData(data) {
            const playerArray = [];

            Object.keys(data).forEach(key => {
                const item = data[key];
                if (!item) return;

                const username = item.ign || item.username;
                if (!username || /^\d+$/.test(username) || username.toLowerCase() === 'unknown') return;

                const rawTiers = item.tiers || {};
                const cleanTiers = {};
                let totalPoints = 0, mainPoints = 0, subPoints = 0;

                Object.keys(rawTiers).forEach(modeKey => {
                    const tierValue = rawTiers[modeKey];
                    if (!tierValue) return;

                    const upperTier = tierValue.toString().toUpperCase().trim();
                    if (TIERS_CONFIG[upperTier]) {
                        const formattedKey = modeKey.toLowerCase().replace(/[\s_]+/g, '').trim();
                        cleanTiers[formattedKey] = upperTier;

                        const pts = TIERS_CONFIG[upperTier];
                        totalPoints += pts;

                        if (MAIN_MODES.includes(formattedKey)) mainPoints += pts;
                        else if (SUB_MODES.includes(formattedKey)) subPoints += pts;
                    }
                });

                if (totalPoints === 0) return;

                let finalRegion = (item.region || item.user_region || "NA").toUpperCase().trim();
                if (finalRegion === "UNKNOWN" || finalRegion === "") finalRegion = "NA";

                playerArray.push({
                    name: username,
                    region: finalRegion,
                    skin: `https://mc-heads.net/avatar/${username}/64`,
                    ranks: cleanTiers,
                    points: totalPoints,
                    mainPoints,
                    subPoints
                });
            });

            return playerArray;
        }

        function getPlayerTitle(pts) {
            if (pts >= 400) return "Combat Grandmaster";
            if (pts >= 250) return "Combat Master";
            if (pts >= 100) return "Combat Ace";
            if (pts >= 50) return "Combat Specialist";
            if (pts >= 20) return "Combat Cadet";
            if (pts >= 10) return "Combat Novice";
            return "Rookie";
        }

        function renderSubNav() {
            const modes = {
                global: ['Overall', ...REGIONS],
                main: ['Overall', 'Sword', 'Axe', 'Vanilla', 'Pot', 'NethOP', 'UHC', 'SMP', 'Mace'],
                sub: ['Overall', 'Minecart', 'DSMP', 'Spear Mace', 'Speed', 'Og Vanilla', 'Creeper', 'Bed', 'Debuff', 'Trident', 'Diamond Survival', 'Manhunt', 'Bow', 'Elytra']
            };

            const container = document.getElementById('sub-nav-container');
            if (!container) return;

            container.innerHTML = modes[state.activeMain].map(m => {
                const iconHtml = (m === 'Overall') ? ICONS.trophy : (REGIONS.includes(m) ? ICONS.globe : `<img src="${ASSETS[m]}" style="width:20px" alt="${m}">`);
                return `<button data-sub="${m}" class="sub-pill ${state.activeSub === m ? 'active' : ''}">${iconHtml}${m}</button>`;
            }).join('');
        }

        function renderContent() {
            const container = document.getElementById('content-display');
            if (!container) return;

            if (state.players.length === 0) {
                renderEmptyState('Connecting to Database...');
                return;
            }

            let list = [...state.players];

            if (state.activeSub === 'Overall') {
                if (state.activeMain === 'main') list = list.filter(p => p.mainPoints > 0).sort((a,b) => b.mainPoints - a.mainPoints);
                else if (state.activeMain === 'sub') list = list.filter(p => p.subPoints > 0).sort((a,b) => b.subPoints - a.subPoints);
                else list.sort((a,b) => b.points - a.points);
            } else if (REGIONS.includes(state.activeSub)) {
                list = list.filter(p => p.region === state.activeSub).sort((a,b) => b.points - a.points);
            } else {
                renderTierColumns(container, list);
                return;
            }

            renderLeaderboardTable(container, list.slice(0, 100));
        }

        function renderTierColumns(container, list) {
            const currentModeClean = state.activeSub.toLowerCase().replace(/[\s_]+/g, '');
            let columnsHtml = `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 lg:gap-6">`;

            for (let t = 1; t <= 5; t++) {
                const filtered = list.filter(p => p.ranks && (p.ranks[currentModeClean] === `HT${t}` || p.ranks[currentModeClean] === `LT${t}`));
                const headerColorClass = t === 1 ? 'tier-1' : t === 2 ? 'tier-2' : t === 3 ? 'tier-3' : 'tier-standard';

                columnsHtml += `
                <div class="tier-column">
                    <div class="tier-header ${headerColorClass}">Tier ${t}</div>
                    <div class="p-4 flex flex-col gap-3 overflow-y-auto max-h-[400px] lg:max-h-none">
                        ${filtered.length === 0 ? '<div class="text-xs text-center text-zinc-600 p-4 font-semibold">Empty</div>' : filtered.map(p => `
                            <div class="player-square" data-player="${p.name}">
                                <img src="${p.skin}" class="w-8 h-8 rounded border border-white/10" alt="${p.name}">
                                <div class="flex flex-col">
                                    <span class="font-bold text-sm text-white">${p.name}</span>
                                    <span class="text-[9px] ${p.ranks[currentModeClean].startsWith('HT') ? 'text-cyan-400' : 'text-zinc-500'} font-black uppercase tracking-wider">${p.ranks[currentModeClean]}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }
            columnsHtml += `</div>`;
            container.innerHTML = columnsHtml;
        }

        function renderLeaderboardTable(container, list) {
            let tableHtml = `
                <div class="hidden lg:flex items-center px-5 mb-2 text-xs font-bold tracking-widest uppercase text-zinc-500/80">
                    <div class="w-20">#</div>
                    <div class="flex-1">Player</div>
                    <div class="w-24">Region</div>
                    <div class="w-80">Tiers</div>
                    <div class="w-32 text-right">Points</div>
                </div>
            `;

            tableHtml += list.map((p, i) => {
                let displayPoints = p.points;
                if (state.activeSub === 'Overall') {
                    if (state.activeMain === 'main') displayPoints = p.mainPoints;
                    if (state.activeMain === 'sub') displayPoints = p.subPoints;
                }

                const podiumClass = i === 0 ? 'podium-1st' : i === 1 ? 'podium-2nd' : i === 2 ? 'podium-3rd' : '';
                const rankColor = i === 0 ? 'text-[#ffe633]' : i === 1 ? 'text-[#f0f0f0]' : i === 2 ? 'text-[#ff9944]' : 'text-zinc-600';

                const sortedTiers = Object.keys(ASSETS).map(m => {
                    const key = m.toLowerCase().replace(/[\s_]+/g, '');
                    const tier = p.ranks ? p.ranks[key] : null;
                    return { assetName: m, tierStr: tier, key, pts: tier ? (TIERS_CONFIG[tier] || 0) : 0 };
                })
                .filter(item => {
                    if (!item.tierStr) return false;
                    if (state.activeMain === 'main') return MAIN_MODES.includes(item.key);
                    if (state.activeMain === 'sub') return SUB_MODES.includes(item.key);
                    return true;
                })
                .sort((a, b) => b.pts - a.pts);

                return `
                <div class="glass-card p-4 md:p-5 mb-4 flex flex-col gap-4 lg:flex-row lg:items-center hover:bg-white/[0.04] hover:border-cyan-500/30 transition cursor-pointer ${podiumClass}" data-player="${p.name}">
                    <div class="flex items-center justify-between lg:justify-start lg:w-20">
                        <div class="font-black text-xl md:text-2xl ${rankColor}">#${i+1}</div>
                        <div class="lg:hidden rating-num">${displayPoints}</div>
                    </div>
                    <div class="flex-1 flex items-center gap-4 md:gap-5">
                        <img src="${p.skin}" class="w-10 h-10 md:w-12 md:h-12 rounded-lg border border-white/10" alt="${p.name}">
                        <div class="flex flex-col">
                            <span class="font-bold text-base md:text-lg leading-tight text-white">${p.name}</span>
                            <span class="text-[11px] font-semibold text-zinc-400/80 mt-0.5 tracking-wide">${getPlayerTitle(p.points)}</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between lg:w-24 border-t border-white/5 pt-3 lg:border-none lg:pt-0">
                        <span class="bg-cyan-500/5 px-2.5 py-1 rounded-lg text-xs font-black border border-cyan-500/10 text-cyan-400 tracking-wider">${p.region}</span>
                    </div>
                    <div class="lg:w-80 flex flex-wrap gap-1.5 items-center">
                        ${sortedTiers.map(item => `
                            <div class="flex items-center bg-white/[0.02] border border-white/[0.05] rounded-md px-1.5 py-0.5 gap-1">
                                <img src="${ASSETS[item.assetName]}" class="w-3.5 h-3.5" alt="${item.assetName}">
                                <div class="text-[9px] font-bold text-zinc-300">${item.tierStr}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="hidden lg:block lg:w-32 text-right rating-num">${displayPoints}</div>
                </div>`;
            }).join('');

            container.innerHTML = tableHtml;
        }

        function renderEmptyState(message) {
            document.getElementById('content-display').innerHTML = `<div class="text-center p-20 text-zinc-500 font-bold">${message}</div>`;
        }

        function setupEventListeners() {

            document.getElementById('main-nav').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-mode]');
                if (!btn) return;
                
                document.querySelectorAll('#main-nav .pill-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                state.activeMain = btn.dataset.mode;
                state.activeSub = 'Overall';
                renderSubNav();
                renderContent();
            });

            document.getElementById('sub-nav-container').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-sub]');
                if (!btn) return;
                
                state.activeSub = btn.dataset.sub;
                renderSubNav();
                renderContent();
            });

            document.getElementById('content-display').addEventListener('click', (e) => {
                const playerCard = e.target.closest('[data-player]');
                if (playerCard) openProfile(playerCard.dataset.player);
            });

            document.getElementById('searchBar').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    const query = e.target.value.trim();
                    if (query) openProfile(query);
                }
            });
            
            document.getElementById('infoBtn').addEventListener('click', () => toggleModal('infoModal', true));
            document.getElementById('infoModal').addEventListener('click', (e) => {
                if (e.target.id === 'infoModal') toggleModal('infoModal', false);
            });
            document.getElementById('profileModal').addEventListener('click', (e) => {
                if (e.target.id === 'profileModal') toggleModal('profileModal', false);
            });
        }

        function openProfile(name) {
            const list = [...state.players].sort((a,b) => b.points - a.points);
            const rankIndex = list.findIndex(x => x.name.toLowerCase() === name.toLowerCase());
            if (rankIndex === -1) return;

            const p = list[rankIndex];
            document.getElementById('p-avatar').src = p.skin;
            document.getElementById('p-name').innerText = p.name;
            document.getElementById('p-region').innerText = `Region: ${p.region}`;
            document.getElementById('p-rank-pos').innerText = `#${rankIndex + 1}`;
            document.getElementById('p-total').innerText = p.points;
            document.getElementById('p-title').innerText = getPlayerTitle(p.points);

            const profilesTiersList = Object.keys(ASSETS).map(m => {
                const key = m.toLowerCase().replace(/[\s_]+/g, '');
                const tier = p.ranks ? p.ranks[key] : null;
                return { modeName: m, tierStr: tier, pts: tier ? (TIERS_CONFIG[tier] || 0) : 0 };
            })
            .filter(item => item.tierStr)
            .sort((a, b) => b.pts - a.pts);

            document.getElementById('p-tiers-grid').innerHTML = profilesTiersList.map(item => `
                <div class="flex flex-col items-center p-2 profile-glass-box rounded-xl">
                    <img src="${ASSETS[item.modeName]}" class="w-6 h-6 mb-1" alt="${item.modeName}">
                    <span class="text-[10px] font-bold text-zinc-400">${item.tierStr}</span>
                </div>`).join('');

            toggleModal('profileModal', true);
        }

        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.toggle('active', show);
        }

        init();
    </script>
</body>
</html>
