        function renderTierColumns(container, list) {
            const currentModeClean = state.activeSub.toLowerCase().replace(/[\s_]+/g, '');
            let totalRanked = 0;

            let columnsHtml = `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-5 lg:gap-8">`;

            for (let t = 1; t <= 5; t++) {
                const filtered = list.filter(p => p.ranks && (p.ranks[currentModeClean] === `HT${t}` || p.ranks[currentModeClean] === `LT${t}`));

                // HT always sits above LT within the same numeric tier; ties broken by points
                filtered.sort((a, b) => {
                    const order = tierRankOrder(a.ranks[currentModeClean]) - tierRankOrder(b.ranks[currentModeClean]);
                    if (order !== 0) return order;
                    return b.points - a.points;
                });

                totalRanked += filtered.length;
                const headerColorClass = t === 1 ? 'tier-1' : t === 2 ? 'tier-2' : t === 3 ? 'tier-3' : 'tier-standard';

                columnsHtml += `
                <div class="tier-column enter-anim" style="animation-delay:${(t - 1) * 70}ms">
                    <div class="tier-header ${headerColorClass}"><span class="facet-dot"></span>Tier ${t}<span class="count-chip">${filtered.length}</span></div>
                    <div class="p-4 flex flex-col gap-5 overflow-y-auto max-h-[400px] lg:max-h-none">
                        ${filtered.length === 0 ? '<div class="text-xs text-center p-4 font-semibold" style="color:var(--ink);">Empty</div>' : filtered.map((p, i) => `
                            <div class="player-square enter-anim" style="animation-delay:${Math.min(i, 14) * 40}ms" data-player="${escapeHtml(p.name)}">
                                <img src="${escapeHtml(p.skin)}" class="avatar-frame w-12 h-12 shrink-0" alt="${escapeHtml(p.name)}">
                                <div class="flex flex-col gap-1.5 min-w-0">
                                    <span class="font-bold text-base truncate leading-tight tracking-wide" style="color:var(--bone);">${escapeHtml(p.name)}</span>
                                    <span class="text-[11px] font-black uppercase tracking-widest leading-none" style="color:${p.ranks[currentModeClean].startsWith('HT') ? 'var(--sky-2)' : '#9ca3af'}; text-shadow: ${p.ranks[currentModeClean].startsWith('HT') ? '0 0 12px rgba(127,227,255,0.6)' : 'none'};">${p.ranks[currentModeClean]}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }
            columnsHtml += `</div>`;

            const topInMode = [...list].filter(p => p.ranks && p.ranks[currentModeClean]).sort((a,b) => (TIERS_CONFIG[a.ranks[currentModeClean]] < TIERS_CONFIG[b.ranks[currentModeClean]] ? 1 : -1))[0];

            container.innerHTML = renderHeroStrip(totalRanked, topInMode) + columnsHtml;
            animateHeroNumbers(container);
        }

        function renderLeaderboard(container, list) {
            const topPlayer = list[0];
            let html = renderHeroStrip(list.length, topPlayer);
            html += state.view === 'grid' ? renderGridView(list) : renderListView(list);
            container.innerHTML = html;
            animateHeroNumbers(container);
        }

        function tiersForPlayer(p) {
            return Object.keys(ASSETS).map(m => {
                const key = m.toLowerCase().replace(/[\s_]+/g, '');
                const tier = p.ranks ? p.ranks[key] : null;
                return { assetName: m, tierStr: tier, key, pts: tier ? (TIERS_CONFIG[tier] || 0) : 0 };
            }).filter(item => {
                if (!item.tierStr) return false;
                if (state.activeMain === 'main') return MAIN_MODES.includes(item.key);
                if (state.activeMain === 'sub') return SUB_MODES.includes(item.key);
                return true;
            }).sort((a, b) => b.pts - a.pts);
        }

        function renderGridView(list) {
            return `<div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                ${list.map((p, i) => {
                    const displayPoints = state.activeMain === 'main' ? p.mainPoints : state.activeMain === 'sub' ? p.subPoints : p.points;
                    const podiumClass = i === 0 ? 'podium-1st' : i === 1 ? 'podium-2nd' : i === 2 ? 'podium-3rd' : '';
                    const rankColor = i === 0 ? 'var(--gold)' : i === 1 ? 'var(--silver)' : i === 2 ? 'var(--bronze)' : 'var(--ink)';
                    const topTiers = tiersForPlayer(p).slice(0, 3);
                    return `
                    <div class="grid-card enter-anim ${podiumClass}" style="animation-delay:${Math.min(i, 20) * 25}ms" data-player="${escapeHtml(p.name)}">
                        <div class="font-black text-sm" style="color:${rankColor}; font-family: var(--font-mono);">#${i + 1}</div>
                        <img src="${escapeHtml(p.skin)}" class="avatar-frame w-14 h-14 rounded-full" alt="${escapeHtml(p.name)}">
                        <span class="font-bold text-sm break-all" style="color:var(--bone);">${escapeHtml(p.name)}</span>
                        <span class="rating-badge px-2 py-0.5 text-[10px] font-black" style="background: rgba(127,227,255,0.06); border: 1px solid rgba(127,227,255,0.22); color: var(--sky-2); font-family: var(--font-mono);">${p.region}</span>
                        <div class="rating-num" style="font-size:1.05rem;">${displayPoints}</div>
                        <div class="flex gap-1 flex-wrap justify-center">
                            ${topTiers.map(item => `<img src="${ASSETS[item.assetName]}" class="w-4 h-4" title="${item.assetName}: ${item.tierStr}" alt="${item.assetName}">`).join('')}
                        </div>
                    </div>`;
                }).join('')}
            </div>`;
        }

        function renderListView(list) {
            let html = `
                <div class="hidden lg:flex items-center px-5 mb-2 text-xs font-bold tracking-widest uppercase" style="color: var(--ink);">
                    <div class="w-20">#</div>
                    <div class="flex-1">Player</div>
                    <div class="w-24">Region</div>
                    <div class="w-80">Tiers</div>
                    <div class="w-32 text-right">Points</div>
                </div>
            `;

            html += list.map((p, i) => {
                const displayPoints = state.activeMain === 'main' ? p.mainPoints : state.activeMain === 'sub' ? p.subPoints : p.points;
                const podiumClass = i === 0 ? 'podium-1st' : i === 1 ? 'podium-2nd' : i === 2 ? 'podium-3rd' : '';
                const rankColor = i === 0 ? 'var(--gold)' : i === 1 ? 'var(--silver)' : i === 2 ? 'var(--bronze)' : 'var(--ink)';
                const sortedTiers = tiersForPlayer(p);

                return `
                <div class="glass-card p-4 md:p-5 mb-4 flex flex-col gap-4 lg:flex-row lg:items-center cursor-pointer enter-anim ${podiumClass}" style="animation-delay:${Math.min(i, 20) * 25}ms" data-player="${escapeHtml(p.name)}">
                    <div class="flex items-center justify-between lg:justify-start lg:w-20">
                        <div class="font-black text-xl md:text-2xl" style="color:${rankColor}; font-family: var(--font-mono);">#${i+1}</div>
                        <div class="lg:hidden rating-num">${displayPoints}</div>
                    </div>
                    <div class="flex-1 flex items-center gap-4 md:gap-5">
                        <img src="${escapeHtml(p.skin)}" class="avatar-frame w-10 h-10 md:w-12 md:h-12" alt="${escapeHtml(p.name)}">
                        <div class="flex flex-col">
                            <span class="font-bold text-base md:text-lg leading-tight" style="color:var(--bone);">${escapeHtml(p.name)}</span>
                            <span class="text-[11px] font-semibold mt-0.5 tracking-wide" style="color:var(--ink);">${getPlayerTitle(p.points)}</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-between lg:w-24 border-t border-white/5 pt-3 lg:border-none lg:pt-0">
                        <span class="rating-badge px-2.5 py-1 text-xs font-black tracking-wider" style="background: rgba(127,227,255,0.06); border: 1px solid rgba(127,227,255,0.22); color: var(--sky-2); font-family: var(--font-mono);">${p.region}</span>
                    </div>
                    <div class="lg:w-80 flex flex-wrap gap-1.5 items-center">
                        ${sortedTiers.map(item => `
                            <div class="flex items-center rounded-full px-2 py-1 gap-1" style="background: rgba(255,255,255,0.025); border: 1px solid rgba(255,255,255,0.07);">
                                <img src="${ASSETS[item.assetName]}" class="w-3.5 h-3.5" alt="${item.assetName}">
                                <div class="text-[9px] font-bold" style="color:var(--bone);">${item.tierStr}</div>
                            </div>
                        `).join('')}
                    </div>
                    <div class="hidden lg:block lg:w-32 text-right rating-num">${displayPoints}</div>
                </div>`;
            }).join('');

            return html;
        }

        function renderEmptyState(message) {
            document.getElementById('content-display').innerHTML = `<div class="text-center p-20 font-bold" style="color: var(--ink); font-family: var(--font-mono);">${message}</div>`;
        }

        function renderInfoModal() {
            const pointsContainer = document.getElementById('info-tab-points');
            if (pointsContainer) {
                pointsContainer.innerHTML = Object.keys(TIERS_CONFIG).map(tierKey => {
                    const isHigh = tierKey.startsWith('HT');
                    return `
                    <div class="profile-glass-box p-3 flex flex-col items-center justify-center gap-1">
                        <span class="text-sm font-black tracking-widest" style="color:${isHigh ? 'var(--sky-2)' : 'var(--ink)'}; font-family: var(--font-mono);">${tierKey}</span>
                        <span class="rating-num" style="font-size: 1.05rem;">${TIERS_CONFIG[tierKey]}<span class="text-[10px]" style="color:var(--ink);"> pts</span></span>
                    </div>`;
                }).join('');
            }

            const titlesContainer = document.getElementById('info-tab-titles');
            if (titlesContainer) {
                titlesContainer.innerHTML = TITLE_THRESHOLDS.map(t => `
                    <div class="profile-glass-box p-3 flex items-center justify-between">
                        <span class="font-bold text-sm" style="color:var(--bone);">${t.title}</span>
                        <span class="text-xs font-black" style="color:var(--sky-1); font-family: var(--font-mono);">${t.min}+ pts</span>
                    </div>`).join('');
            }

            const shortcutsContainer = document.getElementById('info-tab-shortcuts');
            if (shortcutsContainer) {
                const shortcuts = [
                    { key: '/', desc: 'Focus the search bar' },
                    { key: '↑ / ↓', desc: 'Move through search suggestions' },
                    { key: 'Enter', desc: 'Open the selected / typed player' },
                    { key: 'Esc', desc: 'Close any open panel' }
                ];
                shortcutsContainer.innerHTML = shortcuts.map(s => `
                    <div class="profile-glass-box p-3 flex items-center justify-between">
                        <span class="font-bold text-sm" style="color:var(--bone);">${s.desc}</span>
                        <span class="kbd-hint">${s.key}</span>
                    </div>`).join('');
            }
        }

        function switchInfoTab(tab) {
            const tabs = ['points', 'titles', 'shortcuts'];
            tabs.forEach(t => {
                const btn = document.getElementById(`tab-${t}`);
                const panel = document.getElementById(`info-tab-${t}`);
                const isActive = t === tab;
                panel.classList.toggle('hidden', !isActive);
                btn.style.borderColor = isActive ? 'var(--sky-2)' : 'transparent';
                btn.style.color = isActive ? 'var(--sky-1)' : 'var(--ink)';
            });
        }


        function matchingPlayers(query) {
            const q = query.trim().toLowerCase();
            if (!q) return [];
            return state.players
                .filter(p => p.name.toLowerCase().includes(q))
                .sort((a, b) => {
                    const aStarts = a.name.toLowerCase().startsWith(q) ? 0 : 1;
                    const bStarts = b.name.toLowerCase().startsWith(q) ? 0 : 1;
                    if (aStarts !== bStarts) return aStarts - bStarts;
                    return b.points - a.points;
                })
                .slice(0, 6);
        }

        function renderAutocomplete(query) {
            const panel = document.getElementById('autocompletePanel');
            const matches = matchingPlayers(query);
            state.acIndex = -1;

            if (!query.trim()) { panel.classList.remove('active'); panel.innerHTML = ''; return; }

            if (matches.length === 0) {
                panel.innerHTML = `<div class="ac-empty">No players found</div>`;
                panel.classList.add('active');
                return;
            }

            const q = escapeRegex(query.trim());
            const re = new RegExp(`(${q})`, 'ig');

            panel.innerHTML = matches.map((p, i) => {
                const highlighted = escapeHtml(p.name).replace(re, '<mark>$1</mark>');
                return `
                <div class="ac-item" data-index="${i}" data-name="${escapeHtml(p.name)}">
                    <img src="${escapeHtml(p.skin)}" class="w-6 h-6 rounded" alt="${escapeHtml(p.name)}">
                    <span class="font-semibold text-sm" style="color:var(--bone);">${highlighted}</span>
                    <span class="ml-auto text-[10px] font-bold" style="color:var(--ink); font-family: var(--font-mono);">${p.points} pts</span>
                </div>`;
            }).join('');
            panel.classList.add('active');
        }

        function highlightAcIndex(delta) {
            const panel = document.getElementById('autocompletePanel');
            const items = Array.from(panel.querySelectorAll('.ac-item'));
            if (!items.length) return;
            state.acIndex = Math.max(0, Math.min(items.length - 1, state.acIndex + delta));
            items.forEach((el, i) => el.classList.toggle('ac-active', i === state.acIndex));
            items[state.acIndex].scrollIntoView({ block: 'nearest' });
        }

        function closeAutocomplete() {
            document.getElementById('autocompletePanel').classList.remove('active');
            state.acIndex = -1;
        }


        function setupEventListeners() {

            document.getElementById('main-nav').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-mode]');
                if (!btn) return;
                spawnRipple(e, btn);

                document.querySelectorAll('#main-nav .pill-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                state.activeMain = btn.dataset.mode;
                state.activeSub = 'Overall';
                renderSubNav();
                renderToolbar();
                renderContent();
            });

            document.getElementById('sub-nav-container').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-sub]');
                if (!btn) return;
                spawnRipple(e, btn);

                state.activeSub = btn.dataset.sub;
                renderSubNav();
                renderToolbar();
                renderContent();
            });

            document.getElementById('toolbar-container').addEventListener('click', (e) => {
                const sortBtn = e.target.closest('[data-sort]');
                const viewBtn = e.target.closest('[data-view]');
                if (sortBtn) {
                    spawnRipple(e, sortBtn);
                    state.sortBy = sortBtn.dataset.sort;
                    renderToolbar();
                    renderContent();
                } else if (viewBtn) {
                    spawnRipple(e, viewBtn);
                    state.view = viewBtn.dataset.view;
                    renderToolbar();
                    renderContent();
                }
            });

            document.getElementById('content-display').addEventListener('click', (e) => {
                const playerCard = e.target.closest('[data-player]');
                if (playerCard && playerCard.dataset.player) {
                    spawnRipple(e, playerCard);
                    openProfile(playerCard.dataset.player);
                }
            });

            const searchBar = document.getElementById('searchBar');
            searchBar.addEventListener('input', (e) => renderAutocomplete(e.target.value));
            searchBar.addEventListener('focus', (e) => { if (e.target.value.trim()) renderAutocomplete(e.target.value); });

            searchBar.addEventListener('keydown', (e) => {
                const panel = document.getElementById('autocompletePanel');
                const items = Array.from(panel.querySelectorAll('.ac-item'));
                if (e.key === 'ArrowDown') { e.preventDefault(); if (items.length) highlightAcIndex(1); }
                else if (e.key === 'ArrowUp') { e.preventDefault(); if (items.length) highlightAcIndex(-1); }
                else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (state.acIndex >= 0 && items[state.acIndex]) {
                        openProfileFromSupabase(items[state.acIndex].dataset.name);
                    } else {
                        const query = e.target.value.trim();
                        if (query) {
                            const matches = matchingPlayers(query);
                            if (matches.length) openProfileFromSupabase(matches[0].name);
                            else openProfileFromSupabase(query);
                        }
                    }
                    closeAutocomplete();
                } else if (e.key === 'Escape') {
                    closeAutocomplete();
                    e.target.blur();
                }
            });

            document.getElementById('autocompletePanel').addEventListener('click', (e) => {
                const item = e.target.closest('.ac-item');
                if (item) { openProfileFromSupabase(item.dataset.name); closeAutocomplete(); }
            });

            document.addEventListener('click', (e) => {
                if (!e.target.closest('.search-wrap')) closeAutocomplete();
            });

            document.getElementById('infoBtn').addEventListener('click', (e) => { spawnRipple(e, e.currentTarget); toggleModal('infoModal', true); });
            document.getElementById('infoModal').addEventListener('click', (e) => {
                if (e.target.id === 'infoModal') toggleModal('infoModal', false);
            });
            document.getElementById('profileModal').addEventListener('click', (e) => {
                if (e.target.id === 'profileModal') closeProfile();
            });
            document.getElementById('p-close').addEventListener('click', closeProfile);
            document.getElementById('p-share').addEventListener('click', (e) => {
                spawnRipple(e, e.currentTarget);
                navigator.clipboard.writeText(window.location.href).then(() => {
                    showToast('Profile link copied', 'success');
                }).catch(() => showToast('Could not copy link', 'error'));
            });

            document.getElementById('tab-points').addEventListener('click', () => switchInfoTab('points'));
            document.getElementById('tab-titles').addEventListener('click', () => switchInfoTab('titles'));
            document.getElementById('tab-shortcuts').addEventListener('click', () => switchInfoTab('shortcuts'));
            document.addEventListener('keydown', (e) => {
                const tag = (e.target.tagName || '').toLowerCase();
                const isTyping = tag === 'input' || tag === 'textarea';

                if (e.key === '/' && !isTyping) {
                    e.preventDefault();
                    document.getElementById('searchBar').focus();
                } else if (e.key === 'Escape') {
                    if (document.getElementById('profileModal').classList.contains('active')) closeProfile();
                    else if (document.getElementById('infoModal').classList.contains('active')) toggleModal('infoModal', false);
                }
            });

            window.addEventListener('hashchange', handleDeepLink);
        }

        function handleDeepLink() {
            const match = window.location.hash.match(/#player=(.+)/);
            if (match) {
                const name = decodeURIComponent(match[1]);
                void openProfileFromSupabase(name, false);
            }
        }

        function openProfile(name, updateHash = true) {
            const list = [...state.players].sort((a,b) => b.points - a.points);
            const rankIndex = list.findIndex(x => x.name.toLowerCase() === name.toLowerCase());
            if (rankIndex === -1) { showToast(`No player matching "${name}"`, 'error'); return; }

            const p = list[rankIndex];

            const avatar = document.getElementById('p-avatar');
            avatar.src = p.skin;
            avatar.classList.remove('aura-gold', 'aura-silver', 'aura-bronze', 'aura-sky');
            avatar.classList.add(rankIndex === 0 ? 'aura-gold' : rankIndex === 1 ? 'aura-silver' : rankIndex === 2 ? 'aura-bronze' : 'aura-sky');

            document.getElementById('p-name').innerText = p.name;
            document.getElementById('p-region').innerText = `Region: ${p.region}`;
            document.getElementById('p-namemc').href = `https://namemc.com/profile/${encodeURIComponent(p.name)}`;
            document.getElementById('p-rank-pos').innerText = `#${rankIndex + 1}`;
            document.getElementById('p-total').innerText = p.points;
            document.getElementById('p-title').innerText = getPlayerTitle(p.points);

            const progress = getTitleProgress(p.points);
            const progressLabel = document.getElementById('p-progress-label');
            const progressBar = document.getElementById('p-progress-bar');
            progressLabel.innerText = progress.next ? `${progress.remaining} pts to ${progress.next}` : 'Max Prestige Reached';
            progressBar.style.width = '0%';
            requestAnimationFrame(() => { progressBar.style.width = progress.pct + '%'; });

            const profilesTiersList = tiersForModeAgnostic(p);

            document.getElementById('p-tiers-grid').innerHTML = profilesTiersList.map((item, i) => `
                <div class="flex flex-col items-center p-2 profile-glass-box rounded-xl tier-badge enter-anim ${item.tierStr.startsWith('HT') ? 'ht-badge' : ''}" style="animation-delay:${i * 35}ms">
                    <img src="${ASSETS[item.modeName]}" class="w-6 h-6 mb-1" alt="${item.modeName}">
                    <span class="text-[10px] font-bold" style="color:${item.tierStr.startsWith('HT') ? 'var(--sky-2)' : 'var(--ink)'};">${item.tierStr}</span>
                </div>`).join('');

            toggleModal('profileModal', true);

            if (updateHash) history.replaceState(null, '', `#player=${encodeURIComponent(p.name)}`);
            if (rankIndex === 0) setTimeout(fireConfetti, 200);
        }

        function tiersForModeAgnostic(p) {
            return Object.keys(ASSETS).map(m => {
                const key = m.toLowerCase().replace(/[\s_]+/g, '');
                const tier = p.ranks ? p.ranks[key] : null;
                return { modeName: m, tierStr: tier, pts: tier ? (TIERS_CONFIG[tier] || 0) : 0 };
            }).filter(item => item.tierStr).sort((a, b) => b.pts - a.pts);
        }

        function closeProfile() {
            toggleModal('profileModal', false);
            if (window.location.hash.startsWith('#player=')) history.replaceState(null, '', window.location.pathname + window.location.search);
        }

        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            if (modal) modal.classList.toggle('active', show);
        }

        init();
    </script>
</body>
</html>
